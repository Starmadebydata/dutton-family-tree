    <style>
        * {
            margin: 0;

        body {
            display: flex;

        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            text-align: center;
        }
        
        .link-wrapper {
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
            display: inline-block;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.2);
            text-decoration: none;
        }
        
        .link-wrapper:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
            box-shadow: 0 15px 60px rgba(212, 175, 55, 0.4);
        }
        
        .link-wrapper:active {
            transform: scale(0.98);
        }
        
        .link-wrapper img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .link-wrapper:hover {
                transform: scale(1.02);
            }
        }
    </style>
